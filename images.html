<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3f0a18">
<title>Prepleating Styles | Paramesh</title>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>

<style>
:root{
  --maroon:#5b1024;
  --deep:#350914;
  --maroon2:#7a1b36;
  --gold:#c79a45;
  --gold2:#ead08d;
  --cream:#fffaf3;
  --bg:#efede9;
  --card:#fffdfa;
  --border:#ddd5ce;
  --muted:#756b68;
  --shadow:0 10px 30px rgba(53,9,20,.10);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  padding-bottom:88px;
  background:
    radial-gradient(circle at 20% 0%,rgba(199,154,69,.08),transparent 28%),
    linear-gradient(180deg,#f5f2ee 0%,var(--bg) 100%);
  color:#2d2225;
  font-family:Arial,Helvetica,sans-serif;
}
button{font:inherit;touch-action:manipulation}

.header{
  height:62px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:6px 14px;
  background:linear-gradient(135deg,var(--deep),var(--maroon));
  color:#fff;
  position:sticky;
  top:0;
  z-index:30;
  box-shadow:0 6px 22px rgba(53,9,20,.18);
}
.back{
  flex:0 0 39px;
  width:39px;height:39px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:23px;
  display:grid;place-items:center;
  cursor:pointer;
  transition:.18s ease;
}
.back:active{transform:scale(.94)}
.logo{
  width:43px;height:43px;
  object-fit:cover;
  border-radius:50%;
  border:2px solid var(--gold2);
  background:#fff;
  flex:0 0 auto;
}
.brand{min-width:0}
.brand b{display:block;font:700 17px Georgia,serif;white-space:nowrap}
.brand span{display:block;font-size:8px;letter-spacing:1.7px;color:#f7dfa0;margin-top:1px}

.heading{text-align:center;padding:24px 14px 16px}
.small-title{color:var(--gold);font-size:9px;font-weight:900;letter-spacing:2.1px}
h1{margin:5px 0 5px;color:var(--deep);font:700 clamp(24px,4vw,31px) Georgia,serif}
.heading p{margin:0 auto;max-width:460px;color:var(--muted);font-size:10px;line-height:1.55}

.styles{
  width:min(1050px,100%);
  margin:auto;
  padding:4px 14px 24px;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.style-card{
  position:relative;
  overflow:hidden;
  min-width:0;
  background:linear-gradient(180deg,#fffefa,#fffaf3);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease;
}
.style-card:hover{transform:translateY(-3px);box-shadow:0 15px 34px rgba(53,9,20,.14)}
.style-card:active{transform:scale(.985)}
.style-card.selected{
  border-color:var(--gold);
  box-shadow:0 0 0 2px rgba(199,154,69,.18),0 14px 34px rgba(53,9,20,.14);
}
.style-image{
  display:block;
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  background:linear-gradient(145deg,#f5eadc,#d8c3a6);
}
.image-fallback{
  display:none;
  align-items:center;
  justify-content:center;
  aspect-ratio:4/5;
  color:#76552f;
  font:700 17px Georgia,serif;
  letter-spacing:1.5px;
  background:linear-gradient(145deg,#f5eadc,#d8c3a6);
}
.style-info{padding:10px 11px 12px}
.style-name{color:#351d24;font:700 16px Georgia,serif;line-height:1.2}
.charge{color:var(--gold);font-size:10px;font-weight:900;margin-top:4px}
.tap{color:var(--muted);font-size:8px;margin-top:5px}
.selected-label{
  position:absolute;top:8px;right:8px;display:none;
  background:linear-gradient(135deg,var(--maroon),var(--maroon2));
  color:#fff;padding:5px 8px;border-radius:999px;
  font-size:7px;font-weight:900;letter-spacing:.4px;
  box-shadow:0 4px 12px rgba(53,9,20,.22);
  z-index:2;
}
.style-card.selected .selected-label{display:block}

.bottom{
  position:fixed;
  left:0;right:0;bottom:0;
  height:72px;
  padding:5px max(7px,env(safe-area-inset-left)) max(5px,env(safe-area-inset-bottom));
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  background:rgba(255,253,249,.96);
  backdrop-filter:blur(17px);
  -webkit-backdrop-filter:blur(17px);
  border-top:1px solid #d9d0c9;
  box-shadow:0 -8px 26px rgba(53,9,20,.13);
  z-index:40;
}
.nav{
  border:0;background:transparent;color:#75686a;font-size:9px;font-weight:900;
  border-radius:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
}
.nav b{display:block;font-size:19px;line-height:1;margin-bottom:1px}
.nav.active{color:var(--maroon);background:rgba(91,16,36,.05)}
.book{
  margin:-13px 5px 3px;
  border-radius:17px;
  border:3px solid var(--bg);
  background:linear-gradient(145deg,var(--maroon),var(--maroon2));
  color:#fff;
  box-shadow:0 7px 18px rgba(91,16,36,.28);
}
.book b{font-size:21px}

@media(max-width:820px){
  .styles{gap:10px;padding-left:10px;padding-right:10px}
  .style-info{padding:8px}
  .style-name{font-size:13px}
  .tap{font-size:7px}
}

@media(max-width:600px){
  body{padding-bottom:82px}
  .header{height:58px;padding:5px 9px;gap:8px}
  .back{width:37px;height:37px;flex-basis:37px;font-size:22px}
  .logo{width:40px;height:40px}
  .brand b{font-size:15px}
  .brand span{font-size:7px;letter-spacing:1.5px}

  .heading{padding:17px 9px 10px}
  .small-title{font-size:7px;letter-spacing:1.7px}
  h1{font-size:22px;margin:4px 0}
  .heading p{font-size:8.5px;line-height:1.45;max-width:330px}

  .styles{
    grid-template-columns:1fr;
    gap:11px;
    padding:5px 8px 18px;
  }
  .style-card{
    border-radius:15px;
    box-shadow:0 7px 20px rgba(53,9,20,.10);
  }
  .style-card:hover{
    transform:none;
    box-shadow:0 7px 20px rgba(53,9,20,.10);
  }
  .style-image,.image-fallback{
    width:100%;
    aspect-ratio:4/5;
    max-height:none;
  }
  .style-info{padding:10px 11px 11px}
  .style-name{font-size:13px;line-height:1.2}
  .charge{font-size:9px;margin-top:4px}
  .tap{font-size:7px;margin-top:4px;white-space:normal}
  .selected-label{top:7px;right:7px;padding:4px 7px;font-size:6px}

  .bottom{height:64px;gap:3px;padding:4px 5px max(4px,env(safe-area-inset-bottom))}
  .nav{font-size:7px;border-radius:11px}
  .nav b{font-size:16px}
  .book{margin:-10px 4px 2px;border-width:3px;border-radius:15px}
  .book b{font-size:18px}
}

@media(max-width:390px){
  .header{height:55px}
  .back{width:34px;height:34px;flex-basis:34px;font-size:20px}
  .logo{width:37px;height:37px}
  .brand b{font-size:14px}
  .brand span{font-size:6.3px}

  .heading{padding-top:14px}
  .small-title{font-size:6.5px}
  h1{font-size:20px}
  .heading p{font-size:7.7px}

  .styles{gap:5px;padding:4px 5px 14px}
  .style-card{border-radius:10px}
  .style-info{padding:6px 5px 7px}
  .style-name{font-size:8.5px}
  .charge{font-size:7px}
  .tap{font-size:5.6px}
  .selected-label{font-size:4.6px;padding:2.5px 4px}
  .bottom{height:62px}
}

@media(max-width:340px){
  .styles{gap:9px;padding-left:8px;padding-right:8px}
  .style-card{border-radius:13px}
  .style-image,.image-fallback{aspect-ratio:4/5}
  .style-info{padding:9px 10px 10px}
  .style-name{font-size:12px}
  .charge{font-size:8px}
  .tap{font-size:6.3px}
}

@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}
</style>
</head>

<body>
<header class="header">
  <button class="back" aria-label="Back" onclick="history.length>1?history.back():location.href='home.html'">‹</button>
  <img src="logo.jpeg" class="logo" alt="Paramesh Logo">
  <div class="brand"><b>Paramesh</b><span>SAREE PREPLEATING</span></div>
</header>

<section class="heading">
  <div class="small-title">PREPLEATING STYLES</div>
  <h1>Choose Your Style</h1>
  <p>Tap any image to select your preferred prepleating style.</p>
</section>

<main class="styles">
  <article class="style-card" data-type="boxFolding" onclick="selectStyle('boxFolding')" tabindex="0" role="button" aria-label="Select Box Folding">
    <span class="selected-label">SELECTED</span>
    <img src="box-folding.jpg" class="style-image" alt="Box Folding" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="image-fallback">BOX FOLDING</div>
    <div class="style-info">
      <div class="style-name">Box Folding</div>
      <div class="charge" id="boxCharge">₹0</div>
      <div class="tap">Tap image to select</div>
    </div>
  </article>

  <article class="style-card" data-type="buffer" onclick="selectStyle('buffer')" tabindex="0" role="button" aria-label="Select Buffer">
    <span class="selected-label">SELECTED</span>
    <img src="buffer.jpg" class="style-image" alt="Buffer" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="image-fallback">BUFFER</div>
    <div class="style-info">
      <div class="style-name">Buffer</div>
      <div class="charge" id="bufferCharge">₹100</div>
      <div class="tap">Tap image to select</div>
    </div>
  </article>

  <article class="style-card" data-type="hangover" onclick="selectStyle('hangover')" tabindex="0" role="button" aria-label="Select Hangover">
    <span class="selected-label">SELECTED</span>
    <img src="hangover.jpg" class="style-image" alt="Hangover" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
    <div class="image-fallback">HANGOVER</div>
    <div class="style-info">
      <div class="style-name">Hangover</div>
      <div class="charge" id="hangoverCharge">₹200</div>
      <div class="tap">Tap image to select</div>
    </div>
  </article>
</main>

<nav class="bottom" aria-label="Bottom navigation">
  <button class="nav active" onclick="location.href='home.html'"><b>⌂</b>Home</button>
  <button class="nav book" onclick="location.href='booking.html'"><b>＋</b>BOOK NOW</button>
  <button class="nav" onclick="location.href='work.html'"><b>◇</b>How It Works</button>
</nav>

<script>
const firebaseConfig={
  apiKey:"AIzaSyCho5RF5pMpasT8nKz0IBgcX04NAv3ps40",
  authDomain:"paramesh-saree-prepleati-d2726.firebaseapp.com",
  databaseURL:"https://paramesh-saree-prepleati-d2726-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"paramesh-saree-prepleati-d2726",
  storageBucket:"paramesh-saree-prepleati-d2726.firebasestorage.app",
  messagingSenderId:"88137039026",
  appId:"1:88137039026:web:767793a32b754d71bc469e",
  measurementId:"G-4RGS712SV3"
};

firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let charges={boxFolding:0,buffer:100,hangover:200};

function money(n){return '₹'+Number(n||0).toLocaleString('en-IN');}

function markSelected(){
  const urlType=new URLSearchParams(location.search).get('type');
  const saved=localStorage.getItem('paramesh_selected_prepleating');
  const type=urlType||saved||'boxFolding';
  document.querySelectorAll('.style-card').forEach(card=>{
    card.classList.toggle('selected',card.dataset.type===type);
  });
}

function selectStyle(type){
  localStorage.setItem('paramesh_selected_prepleating',type);
  document.querySelectorAll('.style-card').forEach(card=>{
    card.classList.toggle('selected',card.dataset.type===type);
  });
  setTimeout(()=>{location.href='home.html';},180);
}

document.querySelectorAll('.style-card').forEach(card=>{
  card.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();selectStyle(card.dataset.type);}
  });
});

db.ref('prepleating').on('value',snapshot=>{
  const data=snapshot.val();
  if(data){
    charges={
      boxFolding:Number(data.boxFolding??0),
      buffer:Number(data.buffer??100),
      hangover:Number(data.hangover??200)
    };
  }
  document.getElementById('boxCharge').textContent=money(charges.boxFolding);
  document.getElementById('bufferCharge').textContent=money(charges.buffer);
  document.getElementById('hangoverCharge').textContent=money(charges.hangover);
  markSelected();
},()=>{
  markSelected();
});

markSelected();
</script>
</body>
</html>
